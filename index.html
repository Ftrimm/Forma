<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0C0F0E">
<title>Forma</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forma">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0C0F0E;--text:#F3EFE6;--muted:#9AA29D;--accent:#8FB39E;--on-accent:#0C0F0E;
  --acc-rgb:143,179,158;--acc-hi-rgb:190,225,205;--b1:#1D3329;--b2:#243A30;--b3:#18291F;--sheet-rgb:22,28,25;
  --protein:var(--accent);--fat:#D2B07C;--carbs:#8EA6C6;--track:rgba(255,255,255,.09);--div:rgba(255,255,255,.07);
  --danger:#D98C7E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
:root{--gap:0px}
:root .blobs,:root .sheet-wrap,:root .wk,:root #splash{bottom:calc(-1 * var(--gap))}
nav.tabs{margin-bottom:calc(-1 * var(--gap))}
.rest{margin-bottom:calc(-1 * var(--gap))}
:root{padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#splash{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash.out .sp-inner{transform:scale(1.08)}
.sp-inner{display:flex;flex-direction:column;align-items:center;gap:18px;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sp-arc{stroke-dasharray:72 100;stroke-dashoffset:72;animation:spArc 1.1s cubic-bezier(.3,.7,.2,1) .15s forwards}
.sp-dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:spDot .6s cubic-bezier(.34,1.56,.64,1) .55s forwards,spPulse 1.6s ease-in-out 1.3s infinite}
.sp-name{font:600 26px/1 "SF Pro Rounded",ui-rounded,-apple-system,system-ui,sans-serif;letter-spacing:.5px;color:var(--text);opacity:0;transform:translateY(8px);animation:spName .6s cubic-bezier(.2,.8,.2,1) .75s forwards}
@keyframes spArc{to{stroke-dashoffset:0}}
@keyframes spDot{to{transform:scale(1)}}
@keyframes spPulse{0%,100%{transform:scale(1)}50%{transform:scale(.86)}}
@keyframes spName{to{opacity:1;transform:none}}
body.loading #app,body.loading nav.tabs{opacity:0}
#app{transition:opacity .4s ease}
@media (prefers-reduced-motion: reduce){.sp-arc,.sp-dot,.sp-name{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
.mgroup{display:flex;flex-direction:column}
.mhead,.mrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:baseline}
.mrow.single{grid-template-columns:minmax(0,1.3fr) minmax(0,2fr)}
.mhead{font-size:12px;color:var(--muted);padding:6px 0 4px;border-bottom:1px solid var(--div)}
.mhead span:first-child{font-weight:600;color:var(--text);font-size:13px}
.mrow{padding:8px 0;border-bottom:1px solid var(--div);font-size:15px}
.mrow:last-child{border-bottom:0}
[data-a="quick"].card{transition:transform .14s ease}
[data-a="quick"].card:active{transform:scale(.985)}
body.rotating #app,body.rotating nav.tabs,body.rotating .wk-inner,body.rotating .rest{opacity:0;scale:.96;transition:none!important}
body.rotating .tab-ind{transition:none!important}
body.rotated #app,body.rotated nav.tabs,body.rotated .wk-inner,body.rotated .rest{transition:opacity .45s ease,scale .55s cubic-bezier(.2,.8,.2,1)!important}
body.rotated #app > .stack > *,body.rotated .wk-inner > *{animation:rotIn .5s cubic-bezier(.2,.8,.2,1) both}
body.rotated #app > .stack > *:nth-child(2),body.rotated .wk-inner > *:nth-child(2){animation-delay:.04s}
body.rotated #app > .stack > *:nth-child(3),body.rotated .wk-inner > *:nth-child(3){animation-delay:.08s}
body.rotated #app > .stack > *:nth-child(4),body.rotated .wk-inner > *:nth-child(4){animation-delay:.12s}
body.rotated #app > .stack > *:nth-child(5){animation-delay:.16s}
body.rotated #app > .stack > *:nth-child(n+6){animation-delay:.2s}
@keyframes rotIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){body.rotating *,body.rotated *{animation:none!important;transition:none!important}}
.pday{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--div);width:100%;text-align:left}
.pday:last-child{border-bottom:0}
.pdate{width:46px;flex:none;text-align:center;border-radius:14px;padding:6px 0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.pdate b{display:block;font:700 19px/1.1 "SF Pro Rounded",ui-rounded,-apple-system,system-ui,sans-serif}
.pdate span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.pday.today .pdate{background:rgba(var(--acc-rgb),.22);border-color:rgba(var(--acc-hi-rgb),.35)}
.pday.past{opacity:.6}
.pstat{margin-left:auto;flex:none;font-size:13px}
.pbadge{height:26px;border-radius:13px;padding:0 10px;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500}
.pbadge.done{background:rgba(var(--acc-rgb),.22);color:var(--accent)}
.pbadge.miss{background:rgba(217,140,126,.14);color:var(--danger)}
.pbadge.auto{background:rgba(255,255,255,.06);color:var(--muted)}
[data-a="quick"]{cursor:pointer}
.sheet{overscroll-behavior:contain;touch-action:pan-y}
.hs{position:relative;animation:jiggle .32s ease-in-out infinite alternate;animation-delay:var(--d,0s);touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hs:nth-child(even){animation-direction:alternate-reverse}
.hs .hs-body{pointer-events:none}
.hs.dragging{animation:none;z-index:5;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.hs-live{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@keyframes jiggle{from{rotate:-.45deg}to{rotate:.45deg}}
.hs-del{position:absolute;top:-8px;left:-8px;z-index:3;width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  background:rgba(60,64,62,.85);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 10px rgba(0,0,0,.35);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.hs-del span{width:12px;height:2.4px;border-radius:2px;background:var(--text)}
.hs-out{animation:hsOut .26s ease-in forwards!important}
@keyframes hsOut{to{opacity:0;scale:.8}}
.hs-in{animation:hsIn .45s cubic-bezier(.34,1.56,.64,1),jiggle .32s ease-in-out .45s infinite alternate}
@keyframes hsIn{from{opacity:0;scale:.7}to{opacity:1;scale:1}}
.gal{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:24px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.1)}
.gal-prev{pointer-events:none;overflow:hidden;border-radius:20px}
.gal-scale{transform-origin:top left}
@media (prefers-reduced-motion: reduce){.hs,.hs-in{animation:none}}
.gchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.gchips::-webkit-scrollbar{display:none}
.gchips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.gchip{flex:none;height:34px;padding:0 14px;border-radius:17px;font-size:14px;color:var(--muted);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);transition:background-color .2s,color .2s,transform .14s}
.gchip:active{transform:scale(.95)}
.gchip.on{color:var(--text);background:rgba(var(--acc-rgb),.28);border-color:rgba(var(--acc-hi-rgb),.3)}
.glabel{font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:4px 4px 6px}
.glabel span{opacity:.6;margin-left:4px}
.gtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.gtags span{font-size:11px;color:var(--muted);padding:2px 8px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07)}
.ava{display:block;border-radius:50%;object-fit:cover;flex:none}
.ava-ph{display:flex;align-items:center;justify-content:center;font-weight:600;letter-spacing:.5px;color:var(--text);
  background:radial-gradient(120% 120% at 30% 20%,rgba(var(--acc-rgb),.55),rgba(29,51,41,.9));border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.ava-ph svg{width:45%;height:45%}
.icon-btn.has-ava{padding:0;overflow:hidden}
.icon-btn .ava{width:100%!important;height:100%!important}
.phero{display:flex;flex-direction:column;align-items:center;gap:14px;padding:4px 0 8px}
.ava-edit{position:relative;border-radius:50%;padding:3px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .14s}
.ava-edit:active{transform:scale(.96)}
.ava-cam{position:absolute;right:0;bottom:2px;width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;
  background:rgba(var(--acc-rgb),.5);border:1px solid rgba(var(--acc-hi-rgb),.45);color:var(--text);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pname{font-size:22px;font-weight:700;letter-spacing:-.2px}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}
.pstats>div{display:flex;flex-direction:column;align-items:center;padding:12px 4px;gap:2px}
.pstats>div+div{border-left:1px solid var(--div)}
.pstats b{font-size:20px}
.pstats span{font-size:11px;color:var(--muted);text-align:center}
.switch{width:50px;height:30px;border-radius:15px;position:relative;flex:none;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);transition:background-color .25s}
.switch i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:#F3EFE6;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
.switch.on{background:rgba(var(--acc-rgb),.55)}
.switch.on i{transform:translateX(20px)}
.chip.danger{color:var(--danger)}
.menu{border-radius:22px;overflow:hidden;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09)}
.mrow-btn{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;transition:background-color .15s}
.mrow-btn+.mrow-btn{border-top:1px solid var(--div)}
.mrow-btn:active{background:rgba(255,255,255,.05)}
.mico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--accent);
  background:rgba(var(--acc-rgb),.14);border:1px solid rgba(var(--acc-rgb),.2)}
.mico svg{width:18px;height:18px}
.mico .dot{width:14px;height:14px;border-radius:7px;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.mtitle{flex:1;font-size:16px}
.mval{font-size:14px;color:var(--muted);white-space:nowrap}
.mchev{color:var(--muted);opacity:.6;display:flex}
.mchev svg{width:16px;height:16px}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.theme{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 6px;border-radius:20px;font-size:13px;color:var(--muted);
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);transition:border-color .2s,color .2s,transform .14s}
.theme:active{transform:scale(.96)}
.theme.on{color:var(--text);border-color:rgba(var(--acc-hi-rgb),.45);background:rgba(var(--acc-rgb),.1)}
.tsw{position:relative;width:58px;height:58px;border-radius:29px;border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.tsw i{position:absolute;right:6px;bottom:6px;width:18px;height:18px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
html.theming,html.theming *{transition:background-color .4s ease,border-color .4s ease,color .4s ease,fill .4s,stroke .4s!important}
#bgfill{position:fixed;left:0;right:0;top:-200px;bottom:-300px;background:var(--bg);z-index:-1;pointer-events:none}
:root .blobs{bottom:calc(-1 * var(--gap) - 120px)}
nav.tabs{touch-action:none}
nav.tabs.swiping .tab-ind{transition:transform .07s linear}
nav.tabs button.hover{color:var(--accent)}
.sico{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-bottom:6px;color:var(--accent);
  background:rgba(var(--acc-rgb),.14);border:1px solid rgba(var(--acc-rgb),.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.sico svg{width:17px;height:17px;transition:transform .2s ease}
.sico.sm{width:26px;height:26px;border-radius:9px;margin:0}
.sico.sm svg{width:15px;height:15px}
.hic{display:flex;align-items:center;gap:10px}
[data-a="quick"]:active .sico svg{transform:scale(.82)}
.i-needle{transform-box:fill-box;transform-origin:0% 100%}
.i-spin{transform-box:fill-box;transform-origin:center}
.view-in-r .sico svg,.view-in-l .sico svg,.icons-in .sico svg{animation:icoIn .55s cubic-bezier(.34,1.56,.64,1) both}
.view-in-r .s-scale .i-needle,.view-in-l .s-scale .i-needle,.icons-in .s-scale .i-needle{animation:needle .9s cubic-bezier(.34,1.4,.64,1) .1s both}
.view-in-r .s-tape .i-spin,.view-in-l .s-tape .i-spin,.icons-in .s-tape .i-spin{animation:spin .8s cubic-bezier(.2,.8,.2,1) .05s both}
.view-in-r .s-trophy .i-shine,.view-in-l .s-trophy .i-shine,.icons-in .s-trophy .i-shine{animation:shine 1s ease .35s both}
.view-in-r .s-pill svg,.view-in-l .s-pill svg,.icons-in .s-pill svg{animation:pillIn .6s cubic-bezier(.34,1.56,.64,1) both}
@keyframes icoIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes needle{0%{transform:rotate(-70deg)}60%{transform:rotate(12deg)}100%{transform:none}}
@keyframes spin{from{transform:rotate(-200deg)}to{transform:none}}
@keyframes shine{0%,100%{opacity:1}40%{opacity:0}}
@keyframes pillIn{from{opacity:0;transform:rotate(-60deg) scale(.5)}to{opacity:1;transform:none}}
.sheet .mico svg{animation:icoIn .5s cubic-bezier(.34,1.56,.64,1) both}
.sheet .mrow-btn:nth-child(2) .mico svg{animation-delay:.05s}.sheet .mrow-btn:nth-child(3) .mico svg{animation-delay:.1s}.sheet .mrow-btn:nth-child(4) .mico svg{animation-delay:.15s}
.t-ic{display:inline-flex;width:22px;height:22px;border-radius:11px;align-items:center;justify-content:center;margin-right:8px;color:var(--text);background:rgba(var(--acc-rgb),.45)}
.t-ic svg{width:13px;height:13px}
.toast.show .i-tick2{stroke-dasharray:1;animation:draw .35s ease-out .12s both}
@media (prefers-reduced-motion: reduce){.sico svg,.sico svg *,.sheet .mico svg,.toast .i-tick2{animation:none!important}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;height:40px;padding:0 18px;border-radius:20px;display:flex;align-items:center;font-size:14px;font-weight:500;white-space:nowrap}
.toast.show{animation:toastIn .3s cubic-bezier(.34,1.4,.64,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-12px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}
@media (orientation: landscape) and (max-height: 600px){
  :root{--side:84px}
  #app{max-width:none;margin:0;padding:14px calc(18px + env(safe-area-inset-right,0px)) 28px calc(var(--side) + 30px + env(safe-area-inset-left,0px))}
  h1{font-size:28px}
  .head{margin-bottom:12px}
  #app > .stack:not(.ob){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:14px}
  #app > .stack:not(.ob) > h2,#app > .stack:not(.ob) > .row,#app > .stack:not(.ob) > .empty,#app > .stack:not(.ob) > .link{grid-column:1 / -1}
  #app > .stack.ob{max-width:560px;margin:0 auto}
  :root nav.tabs{left:calc(12px + env(safe-area-inset-left,0px));top:50%;bottom:auto;margin-bottom:0;transform:translateY(-50%);
    width:var(--side);max-width:none;height:auto;padding:4px;border-radius:28px;
    grid-template-columns:1fr;grid-template-rows:repeat(5,58px)}
  :root nav.tabs button{font-size:10px;gap:3px}
  :root .tab-ind{top:4px;left:4px;right:4px;bottom:auto;width:auto;height:58px;border-radius:24px;transform:translateY(calc(var(--i, 0) * 100%))}
  .wk-inner{max-width:none;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start;gap:14px;
    padding:10px calc(18px + env(safe-area-inset-right,0px)) 100px calc(18px + env(safe-area-inset-left,0px))}
  .wk-inner > .between:first-child{grid-column:1 / -1}
  .wk-inner > .card:nth-child(2){grid-row:2 / span 3}
  .rest{bottom:calc(8px + env(safe-area-inset-bottom,0px));height:62px;max-width:440px}
  .sheet{max-height:94%;max-width:600px;border-radius:24px 24px 0 0}
  .sheet-top{height:44px}
  .sheet-x{top:4px}
  :root .toast{left:calc(50% + var(--side) / 2)}
  :root .ring{width:108px;height:108px}
  .ring svg{width:100%;height:100%}
  :root .rest{margin-bottom:0}
}

html{background:var(--bg);min-height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font:400 16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
.blobs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;background:var(--bg)}
.blobs i{position:absolute;border-radius:50%;filter:blur(90px)}
.blobs i:nth-child(1){width:360px;height:360px;left:-120px;top:-80px;background:var(--b1);opacity:.45}
.blobs i:nth-child(2){width:300px;height:300px;right:-130px;top:40%;background:var(--b2);opacity:.35}
.blobs i:nth-child(3){width:280px;height:280px;left:-60px;bottom:-60px;background:var(--b3);opacity:.4}
.num{font-family:"SF Pro Rounded",ui-rounded,-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.glass{background:linear-gradient(160deg,rgba(var(--acc-rgb),.10),rgba(255,255,255,.035) 70%);border:1px solid rgba(255,255,255,.11);box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
  backdrop-filter:blur(26px) saturate(115%);-webkit-backdrop-filter:blur(26px) saturate(115%)}
.solid{background:linear-gradient(160deg,rgba(var(--acc-rgb),.085),rgba(var(--acc-rgb),.02) 65%),rgba(var(--sheet-rgb),.5);border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
/* кнопки внутри стеклянных карточек — без второго размытия (иначе Safari иногда рисует их белыми) */
.glass .btn,.glass .chip,.glass .icon-btn,.glass .link,.solid .btn,.solid .chip,.solid .icon-btn,.solid .link,.solid .check,.glass .check{backdrop-filter:none;-webkit-backdrop-filter:none}
button{-webkit-appearance:none;appearance:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:18px 18px 120px}
h1{margin:6px 0 0;font-size:34px;font-weight:700;letter-spacing:-.5px}
h2{margin:0;font-size:19px;font-weight:600}
.sub{font-size:14px;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card{border-radius:24px;padding:18px}
.card.tight{padding:8px 18px}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.icon-btn{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none}
.btn,.chip,.icon-btn,.check,.stepper button,.seg{
  border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.07);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.18),0 4px 14px rgba(0,0,0,.18);
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);color:var(--text)}
.btn{height:50px;border-radius:25px;padding:0 22px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(var(--acc-rgb),.26);border-color:rgba(var(--acc-hi-rgb),.28);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.22)}
.btn.block{width:100%}
.btn.ghost{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.18)}
.chip.on{background:rgba(var(--acc-rgb),.3);border-color:rgba(var(--acc-hi-rgb),.3)}
.icon-btn.plain{border-color:transparent;background:transparent;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.btn.small{height:40px;border-radius:20px;padding:0 16px;font-size:15px}
.chip{height:36px;border-radius:18px;padding:0 14px;font-size:14px;display:inline-flex;align-items:center}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--div)}
.list-item:last-child{border-bottom:0}
.check{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.check.on{background:rgba(var(--acc-rgb),.45);border-color:rgba(var(--acc-hi-rgb),.45)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ring{position:relative;width:128px;height:128px}
.ring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.banner{border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-size:14px}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:15px}
.danger{color:var(--danger)}
.warn{color:var(--fat)}
.link{color:var(--accent);font-size:15px;font-weight:500;height:36px;padding:0 14px;border-radius:18px;display:inline-flex;align-items:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .14s ease}
.link:active{transform:scale(.95)}
.link.danger{color:var(--danger)}

/* tab bar */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));
  width:calc(100% - 28px);max-width:492px;height:64px;border-radius:32px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center;z-index:20}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;height:100%;justify-content:center}
nav.tabs button.on{color:var(--accent)}

/* forms */
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.input,select.input{min-width:0;max-width:100%;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.035);box-shadow:inset 0 1px 0 rgba(255,255,255,.07);padding:0 14px;font-size:16px;color:var(--text);width:100%;-webkit-appearance:none;appearance:none}
.input:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;border-radius:16px;padding:3px;gap:3px}
.seg button{flex:1;height:40px;border-radius:13px;font-size:14px;color:var(--muted);transition:background-color .25s,color .25s}
.seg button.on{background:rgba(255,255,255,.14);color:var(--text);font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.28)}
.sheet-wrap[hidden]{display:none}
.sheet{position:relative;width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:28px 28px 0 0;padding:0 18px calc(24px + env(safe-area-inset-bottom,0px));
  background:rgba(var(--sheet-rgb),.62);border:1px solid rgba(255,255,255,.14);border-bottom:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 -10px 40px rgba(0,0,0,.35);
  backdrop-filter:blur(34px) saturate(150%);-webkit-backdrop-filter:blur(34px) saturate(150%);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet-top{position:relative;height:56px;margin:0 -18px 4px;display:flex;align-items:center;justify-content:center}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22)}
.sheet-x{position:absolute;right:12px;top:8px;width:36px;height:36px;border-radius:18px;color:var(--muted)}
.sheet .solid{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.1);backdrop-filter:none;-webkit-backdrop-filter:none}
.sheet .input,.sheet select.input{background:rgba(255,255,255,.03)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}

/* workout */
.wk{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--bg)}
.wk-inner{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 150px}
.setrow{display:grid;grid-template-columns:28px minmax(0,1.4fr) minmax(0,1fr) 32px;gap:6px;align-items:center;padding:8px 4px;border-radius:12px}
.setrow.active{padding:10px 4px;background:rgba(var(--acc-rgb),.08);border:1px solid rgba(var(--acc-rgb),.3)}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:30px;height:30px;border-radius:15px;font-size:17px;flex:none}
.stepper input{width:100%;min-width:0;background:transparent;border:0;text-align:center;font-size:21px;font-weight:700;color:var(--text);padding:0}
.stepper input:focus{outline:none;background:rgba(255,255,255,.06);border-radius:8px}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));width:calc(100% - 36px);max-width:484px;height:72px;border-radius:36px;
  display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 22px;z-index:35}
.done-mark{width:28px;height:28px;border-radius:14px;background:rgba(var(--acc-rgb),.2);display:flex;align-items:center;justify-content:center}
svg{display:block}
nav.tabs{grid-template-columns:repeat(5,minmax(0,1fr));padding:4px}
nav.tabs button{position:relative;z-index:1;transition:color .25s ease}
nav.tabs button svg{transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
nav.tabs button.on svg{transform:scale(1.1)}
.tab-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 5);transform:translateX(calc(var(--i, 0) * 100%));border-radius:28px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.09);transition:transform .5s cubic-bezier(.34,1.25,.5,1);z-index:0}
.view-in-r{animation:inR .34s cubic-bezier(.2,.8,.2,1)}
.view-in-l{animation:inL .34s cubic-bezier(.2,.8,.2,1)}
@keyframes inR{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-32px)}to{opacity:1;transform:none}}
.wk.in{animation:wkIn .38s cubic-bezier(.2,.8,.2,1)}
@keyframes wkIn{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet-wrap{transition:background-color .22s ease}
.sheet-wrap.closing{background-color:rgba(0,0,0,0)}
.sheet-wrap.closing .sheet{transform:translateY(80px);opacity:0;transition:transform .22s ease-in,opacity .22s ease-in}
.btn,.chip,.check,.icon-btn,.list-item,.stepper button{transition:transform .14s ease,background-color .2s ease}
.btn:active,.chip:active,.check:active,.icon-btn:active,.list-item:active,.stepper button:active{transform:scale(.95)}
.check.on.just{animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.check.on.just .i-tick{stroke-dasharray:1;animation:draw .32s ease-out .08s both}
.i-core,.i-lift,.i-fork,.i-knife{transform-box:fill-box;transform-origin:center}
.i-fork{transform-origin:50% 100%}.i-knife{transform-origin:50% 100%}
nav.tabs button.play .i-core{animation:core .55s cubic-bezier(.34,1.56,.64,1)}
nav.tabs button.play .i-lift{animation:lift .6s cubic-bezier(.34,1.4,.64,1)}
nav.tabs button.play .i-fork{animation:forkL .5s ease-out}
nav.tabs button.play .i-knife{animation:forkR .5s ease-out}
.i-cal{transform-box:fill-box;transform-origin:50% 0%}
.i-calck{stroke-dasharray:1;stroke-dashoffset:0}
nav.tabs button.play .i-cal{animation:calFlip .5s cubic-bezier(.34,1.4,.64,1)}
nav.tabs button.play .i-calck{animation:draw .45s ease-out .15s both}
@keyframes calFlip{0%{transform:none}35%{transform:rotateX(0) translateY(-2px) scale(.94)}100%{transform:none}}
nav.tabs button.play .i-draw{stroke-dasharray:1;animation:draw .6s cubic-bezier(.3,.7,.3,1) both}
@keyframes core{0%{transform:scale(1)}35%{transform:scale(.35)}100%{transform:scale(1)}}
@keyframes lift{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-3px) rotate(-12deg)}70%{transform:translateY(-1px) rotate(6deg)}100%{transform:none}}
@keyframes forkL{0%,100%{transform:none}40%{transform:rotate(-14deg)}}
@keyframes forkR{0%,100%{transform:none}40%{transform:rotate(14deg)}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.err{margin:0;font-size:13px;color:var(--danger)}
details>summary{cursor:pointer;color:var(--accent);font-size:15px;list-style:none;padding:6px 0}
details>summary::-webkit-details-marker{display:none}
@media (prefers-reduced-motion: reduce){.view-in-r,.view-in-l,.wk.in,.check.on.just,.check.on.just .i-tick,nav.tabs button.play *{animation:none!important}.tab-ind,.sheet-wrap.closing .sheet{transition:none}}
</style>
</head>

function statBox(label, value, sub) {

function quickSheet(id) {

      <div class="card solid"><div class="grid3">${macroBar("Белки", t.p, n.prot, "var(--protein)")}${macroBar("Жиры", t.f, n.fat, "var(--fat)")}${macroBar("Углеводы", t.c, n.carbs, "var(--carbs)")}</div></div>
      <div class="small">${days.length ? `В среднем за прошлую неделю: <span class="num">${f0(avgK)} ккал, белок ${f0(avgP)} г</span>` : "Статистика за неделю появится, когда заполнишь несколько дней"}</div>
      ${quick.length ? `<div class="row" style="flex-wrap:wrap;gap:8px">${quick.map(p => `<button class="chip" data-a="addFood" data-id="${p.id}">${h(p.name)}</button>`).join("")}</div>` : ""}
      <button class="btn block" data-a="addFood">${ICON.plus("currentColor")}Добавить еду</button>

  }
  if (id === "workout") {
    const now = Date.now(), wk = S.sessions.filter(s => now - s.start < 7 * 864e5), mo = S.sessions.filter(s => now - s.start < 30 * 864e5);
    const ton = arr => arr.reduce((a, s) => a + s.entries.reduce((b, e) => b + e.sets.reduce((c, st) => c + (st.warm ? 0 : st.w * st.r), 0), 0), 0);
    const last = S.sessions[S.sessions.length - 1];

      <div class="grid2">${statBox("За 7 дней", pl(wk.length, ["тренировка", "тренировки", "тренировок"]), f0(ton(wk)) + " кг тоннаж")}${statBox("За 30 дней", pl(mo.length, ["тренировка", "тренировки", "тренировок"]), f0(ton(mo)) + " кг тоннаж")}</div>

      ${S.active ? `<button class="btn block" data-a="resume">Продолжить ${h(S.active.name)}</button>`
        : ready.map(t => `<button class="btn block" data-a="start" data-id="${t.id}">Начать ${h(t.name)}</button>`).join("") || `<div class="small">Наполни шаблон упражнениями, чтобы начать</div>`}
      <button class="link" style="align-self:center" data-a="tab" data-id="wk">Все тренировки</button></div>`;
  }
  if (id === "supps") {

    return `<div class="stack"><h2>Добавки</h2>

        return `<div class="list-item"><div class="stack" style="gap:2px"><div style="font-weight:500">${h(s.name)}</div><div class="small ${left !== null && left <= (s.low ?? 7) ? "warn" : ""}">${left !== null ? "осталось " + pl(left, W_SERV) : "запас не указан"}</div></div>
        <div class="num small">${cnt} из 7 дней</div></div>`; }).join("")}</div>
      <button class="btn block" data-a="suppAll">Отметить все на сегодня</button>` : `<div class="empty">Добавок пока нет</div>`}

  }

      ${keys.length ? `<div class="card solid tight">${keys.map(([k, m]) => `<div class="list-item"><span>${MLABEL[k]}</span><span class="num">${f1(m[k])} см</span></div>`).join("")}</div>` : `<div class="empty">Замеров пока нет</div>`}
      <button class="btn block" data-a="addMeasure">${ICON.plus("currentColor")}Добавить замер</button>
      <button class="link" style="align-self:center" data-a="tab" data-id="prog">Весь прогресс</button></div>`;
  }
  if (id === "records") {

      <button class="link" style="align-self:center" data-a="tab" data-id="prog">Все рекорды</button></div>`;
  }
  return "";
}

function prefill(entry) {
  const a = S.active, ex = exById(entry.ex);
  const last = lastSetsFor(entry.ex, a.id), i = entry.sets.length;
  let w = 20, r = 10;
  const sameSide = s => !ex.uni || s.side === a.side;
  const thisSide = entry.sets.filter(sameSide);
  if (last) { const ls = last.filter(sameSide); const src = ls[thisSide.length] || ls[ls.length - 1] || last[Math.min(i, last.length - 1)]; if (src) { w = src.w; r = src.r; } }
  else if (thisSide.length) { const p = thisSide[thisSide.length - 1]; w = p.w; r = p.r; }
  return { w, r };
}
function renderWorkout() {

function readDraft() {
  const a = S.active; if (!a) return;

function tickRest() {

  const el = $("#rest"); if (!el) return;
  const upd = () => {

  const a = S.active; if (!a) return;

  const sess = { id: a.id, tpl: a.tpl, name: a.name, start: a.start, end: Date.now(), entries: entries.map(e => ({ ex: e.ex, sets: e.sets })) };

  const REN = { "Фулбади A": "Фулбади А", "Фулбади B": "Фулбади Б" };
  S.templates.forEach(t => { if (REN[t.name]) t.name = REN[t.name]; });
  S.sessions.forEach(x => { if (REN[x.name]) x.name = REN[x.name]; });
  if (S.active && REN[S.active.name]) S.active.name = REN[S.active.name];
  S.supps.forEach(x => { const U = { "капс": "капс.", "таб": "табл.", "скуп": "шт." }; if (U[x.unit]) x.unit = U[x.unit]; });
  render();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const wait = Math.max(0, (reduce ? 500 : 1900) - (Date.now() - t0));
  setTimeout(() => {
    const sp = $("#splash"); sp.classList.add("out"); document.body.classList.remove("loading");
    app.classList.add("icons-in"); setTimeout(() => app.classList.remove("icons-in"), 1200);
    setTimeout(() => sp.remove(), 500);
  }, wait);
})();
})();
</script>
